<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Estados visuais da galeria Lumina</title><desc id="desc">Matriz de conteúdo, seleção, vazio, erro, processamento e preview HD.</desc>
  <style>.bg{fill:#f5f3ed}.card{fill:#fbfaf6;stroke:#d8d8d0;stroke-width:2}.green{fill:#e3f2e9;stroke:#2f745a;stroke-width:2}.amber{fill:#fff3dc;stroke:#ca8735;stroke-width:2}.red{fill:#f8e7e4;stroke:#b95d4e;stroke-width:2}.ink{fill:#25312d;font:700 18px sans-serif}.muted{fill:#718078;font:13px sans-serif}.label{fill:#2f745a;font:700 12px sans-serif}.thumb{fill:#dbe4de}.line{stroke:#d8d8d0;stroke-width:2}</style>
  <rect class="bg" width="1280" height="720"/><text class="ink" x="48" y="54" font-size="28">Baseline de estados</text>
  <g transform="translate(48 86)"><rect class="card" rx="16" width="360" height="250"/><text class="label" x="22" y="34">CONTEÚDO</text><rect class="thumb" x="22" y="54" rx="10" width="96" height="90"/><rect class="thumb" x="132" y="54" rx="10" width="96" height="90"/><rect class="thumb" x="242" y="54" rx="10" width="96" height="90"/><text class="ink" x="22" y="182">Grade ou lista</text><text class="muted" x="22" y="208">Mesma coleção, filtros e seleção</text></g>
  <g transform="translate(460 86)"><rect class="green" rx="16" width="360" height="250"/><text class="label" x="22" y="34">SELEÇÃO</text><rect x="22" y="54" rx="10" width="316" height="48" fill="#173d32"/><text x="42" y="84" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">3 mídias selecionadas</text><rect class="card" x="22" y="122" rx="10" width="96" height="90"/><rect class="thumb" x="132" y="122" rx="10" width="96" height="90"/><text class="muted" x="242" y="158">Ações em lote</text><text class="muted" x="242" y="180">reversíveis</text></g>
  <g transform="translate(872 86)"><rect class="card" rx="16" width="360" height="250"/><text class="label" x="22" y="34">VAZIO</text><circle cx="180" cy="104" r="34" fill="#e8f1ed"/><text class="ink" x="82" y="166">Nenhuma mídia</text><text class="muted" x="75" y="194">Limpar filtros ou importar fonte</text></g>
  <g transform="translate(48 386)"><rect class="red" rx="16" width="360" height="250"/><text x="22" y="34" fill="#a74439" font-family="sans-serif" font-size="12" font-weight="700">ERRO ACIONÁVEL</text><text class="ink" x="22" y="92">Não foi possível carregar</text><text class="muted" x="22" y="120">A coleção permanece preservada.</text><rect class="card" x="22" y="154" rx="9" width="142" height="42"/><text class="ink" x="40" y="181" font-size="14">Tentar novamente</text></g>
  <g transform="translate(460 386)"><rect class="amber" rx="16" width="360" height="250"/><text x="22" y="34" fill="#95620a" font-family="sans-serif" font-size="12" font-weight="700">PROCESSAMENTO</text><text class="ink" x="22" y="92">Miniaturas em segundo plano</text><rect x="22" y="128" rx="6" width="316" height="10" fill="#e4d5b5"/><rect x="22" y="128" rx="6" width="198" height="10" fill="#ca8735"/><text class="muted" x="22" y="172">A galeria continua interativa.</text></g>
  <g transform="translate(872 386)"><rect class="green" rx="16" width="360" height="250"/><text class="label" x="22" y="34">PREVIEW PROGRESSIVO</text><rect x="22" y="54" rx="10" width="316" height="126" fill="#17201d"/><rect x="42" y="142" rx="14" width="86" height="24" fill="#2f745a"/><text x="57" y="159" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700">PRÉVIA HD</text><text class="muted" x="22" y="214">Miniatura imediata → derivado HD</text></g>
</svg>
