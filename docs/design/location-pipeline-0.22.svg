<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">Pipeline de localizações Lumina 0.22</title><desc id="desc">Fluxo privado desde os metadados da mídia até agrupamento, override e galeria.</desc><style>text{font-family:Segoe UI,Arial;fill:#183d32}.h{font-size:22px;font-weight:700}.t{font-size:14px}.s{font-size:12px;fill:#587066}.box{fill:#f8faf7;stroke:#9bb9aa;stroke-width:2}.accent{fill:#e5f2ec;stroke:#34745b;stroke-width:2}.arrow{stroke:#34745b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#34745b"/></marker></defs><text x="40" y="45" class="h">Lumina 0.22 · localização privada e explicável</text><rect x="40" y="100" width="190" height="115" rx="15" class="box"/><text x="60" y="130" class="t">Arquivo original</text><text x="60" y="158" class="s">EXIF · XMP · IPTC</text><text x="60" y="180" class="s">QuickTime · GPS</text><rect x="290" y="80" width="220" height="155" rx="15" class="accent"/><text x="310" y="112" class="t">Normalização v3</text><text x="310" y="140" class="s">1. Nome embutido</text><text x="310" y="162" class="s">2. Geocoder offline</text><text x="310" y="184" class="s">3. Aproximação honesta</text><text x="310" y="206" class="s">+ precisão e procedência</text><rect x="570" y="80" width="220" height="155" rx="15" class="box"/><text x="590" y="112" class="t">Catálogo v18</text><text x="590" y="140" class="s">Detalhe por ativo</text><text x="590" y="162" class="s">Célula de ~100 m</text><text x="590" y="184" class="s">Versão do algoritmo</text><text x="590" y="206" class="s">Override preservado</text><rect x="850" y="100" width="220" height="115" rx="15" class="accent"/><text x="870" y="130" class="t">Experiência</text><text x="870" y="158" class="s">Lugares · viagens · filtros</text><text x="870" y="180" class="s">Inspetor e coordenadas</text><path d="M230 157h60M510 157h60M790 157h60" class="arrow"/><rect x="405" y="295" width="310" height="80" rx="15" class="box"/><text x="425" y="327" class="t">Regra soberana</text><text x="425" y="352" class="s">Correção humana nunca é substituída</text><path d="M560 295V235" class="arrow"/></svg>
