<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Arquitetura Lumina 0.21</title><desc id="d">Datas confiáveis, lugares offline e bursts coerentes.</desc><style>.bg{fill:#f7f5ef}.b{fill:#fff;stroke:#cad4cd;stroke-width:2}.a{fill:#e7f2ec;stroke:#39845c;stroke-width:2}.t{font:600 18px system-ui;fill:#183128}.s{font:14px system-ui;fill:#52635c}.l{stroke:#74827c;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#74827c"/></marker></defs><rect class="bg" width="1200" height="460" rx="24"/><text class="t" x="45" y="48">Lumina 0.21 · confiança antes da automação</text><g transform="translate(45 95)"><rect class="b" width="260" height="110" rx="14"/><text class="t" x="20" y="38">Relógio da câmera</text><text class="s" x="20" y="68">hora local sem UTC inventado</text><text class="s" x="20" y="91">origem sempre visível</text></g><path class="l" d="M305 150H365"/><g transform="translate(365 95)"><rect class="a" width="260" height="110" rx="14"/><text class="t" x="20" y="38">Catálogo v17</text><text class="s" x="20" y="68">migração transacional</text><text class="s" x="20" y="91">ordenação consistente</text></g><path class="l" d="M625 150H685"/><g transform="translate(685 95)"><rect class="b" width="225" height="110" rx="14"/><text class="t" x="20" y="38">Lugares offline</text><text class="s" x="20" y="68">base mundial + fallback</text><text class="s" x="20" y="91">override soberano</text></g><path class="l" d="M910 150H970"/><g transform="translate(970 95)"><rect class="a" width="185" height="110" rx="14"/><text class="t" x="20" y="38">Galeria</text><text class="s" x="20" y="68">filtro exato</text><text class="s" x="20" y="91">inspeção</text></g><g transform="translate(365 285)"><rect class="b" width="260" height="110" rx="14"/><text class="t" x="20" y="38">Bursts v2</text><text class="s" x="20" y="68">tempo + câmera + visual</text><text class="s" x="20" y="91">eventos não se misturam</text></g><path class="l" d="M625 340H685"/><g transform="translate(685 285)"><rect class="a" width="260" height="110" rx="14"/><text class="t" x="20" y="38">Curadoria reversível</text><text class="s" x="20" y="68">favoritar melhor</text><text class="s" x="20" y="91">alternativas para revisão</text></g><text class="s" x="45" y="430">Sem rede · sem alteração de originais · sem exclusão automática</text></svg>
