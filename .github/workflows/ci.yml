name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout with runtime fixtures
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled media tools
        shell: powershell
        run: |
          $version = & ./src-tauri/tools/exiftool.exe -ver
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "ExifTool não iniciou" }
          & ./src-tauri/tools/ffprobe.exe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "FFprobe não iniciou" }
